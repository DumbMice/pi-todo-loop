name: publish

# Publishes to npm when a version tag is pushed, using npm Trusted Publishing.
#
# Configure the publisher once at https://www.npmjs.com/package/pi-todo-loop/access
# (or "Pending publisher" before the first release):
#   Provider: GitHub Actions
#   Organization or user: DumbMice
#   Repository: pi-todo-loop
#   Workflow filename: publish.yml
#   Environment: (leave empty)
#
# With that in place this workflow needs no NPM_TOKEN: it exchanges the job's OIDC
# token for a short-lived publish credential, and npm attaches a provenance
# attestation automatically for a public repository.
#
# Only a pushed v* tag publishes. To verify the pipeline without publishing, push a tag
# on a scratch fork, or run the steps locally with `npm publish --dry-run`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write # create the GitHub release
  id-token: write # trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Use the latest npm
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run pack:check

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json $version"
            exit 1
          fi

      - name: Pack and verify what would be published
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/packed
          tar xzf /tmp/pi-todo-loop-*.tgz -C /tmp/packed
          test -f /tmp/packed/package/src/index.ts
          node -e '
            const p = require("/tmp/packed/package/package.json");
            if (!p.pi) throw new Error("packed manifest lost pi");
            if (!p.pi.extensions || !p.pi.extensions.includes("./src/index.ts"))
              throw new Error("packed manifest lost pi.extensions");
            console.log("packed manifest ok:", p.name, p.version);
          '

      # The first version of a new package has to be created from the CLI (or with a
      # pending publisher). After that this workflow is the publisher, and a re-run of
      # a tag whose version already exists must not fail the release.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "pi-todo-loop@$version" version >/dev/null 2>&1; then
            echo "::notice::pi-todo-loop@$version is already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("node:fs");
            const version = require("./package.json").version;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((l) => l.startsWith(`## [${version}]`));
            if (start === -1) throw new Error(`no CHANGELOG section for ${version}`);
            const rest = lines.slice(start + 1);
            const end = rest.findIndex((l) => l.startsWith("## ["));
            const notes = (end === -1 ? rest : rest.slice(0, end)).join("\n").trim();
            fs.writeFileSync("/tmp/release-notes.md", notes || `See CHANGELOG.md`);
          '
          gh release create "v$version" --title "v$version" --notes-file /tmp/release-notes.md --verify-tag
