name: publish

# Publishes to npm when a version tag is pushed, using npm Trusted Publishing.
#
# Configure the publisher once at https://www.npmjs.com/package/pi-todo-loop/access
# (or "Pending publisher" before the first release):
#   Provider: GitHub Actions
#   Organization or user: DumbMice
#   Repository: pi-todo-loop
#   Workflow filename: publish.yml
#   Environment: (leave empty)
#
# With that in place this workflow needs no NPM_TOKEN: it exchanges the job's OIDC
# token for a short-lived publish credential and npm attaches a provenance
# attestation automatically for a public repository.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub release
  id-token: write # trusted publishing (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Use the latest npm
        run: npm install --global npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run pack:check

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json $version"
            exit 1
          fi

      - name: Pack and install what would be published
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/packed && tar xzf /tmp/pi-todo-loop-*.tgz -C /tmp/packed
          test -f /tmp/packed/package/src/index.ts
          node -e '
            const p = require("/tmp/packed/package/package.json");
            if (!p.pi?.extensions?.includes("./src/index.ts")) {
              console.error("packed manifest lost pi.extensions");
              process.exit(1);
            }
          '

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)"
          gh release create "v$version" --title "v$version" --notes "${notes:-See CHANGELOG.md}" --verify-tag
